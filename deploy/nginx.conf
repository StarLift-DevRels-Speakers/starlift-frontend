# StarLift SPA: static files from `yarn build`, client-side routing via react-router.
server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Vite puts content hashes into asset names, so they can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The entry page must always be revalidated to pick up a new deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Any app route (/speaker/profile, /feedback/<token>, ...) is handled in the browser.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
